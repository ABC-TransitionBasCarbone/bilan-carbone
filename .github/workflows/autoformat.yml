name: Auto format

# Runs after a failed CI (typically `prettier --check`) and pushes the formatted code back.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  format:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: 'yarn'

      - name: Copy .env files (needed for postinstall scripts)
        run: |
          cp apps/bilan-carbone/.env.dist apps/bilan-carbone/.env
          cp apps/mip/.env.dist apps/mip/.env
          cp apps/bilan-carbone/.env.dist packages/db-common/.env

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format
        run: yarn format

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply yarn format"
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}
