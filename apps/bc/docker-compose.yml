name: bilan-carbone

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bilancarbone
      POSTGRES_USER: bilancarbone
      POSTGRES_PASSWORD: bilancarbone
    ports:
      - '5432:5432'
  db_test:
    image: postgres:17
    environment:
      POSTGRES_DB: bilancarbone_test
      POSTGRES_USER: bilancarbone
      POSTGRES_PASSWORD: bilancarbone
    ports:
      - '5433:5432'
  maildev:
    image: maildev/maildev
    ports:
      - '1080:1080'
      - '1025:1025'
